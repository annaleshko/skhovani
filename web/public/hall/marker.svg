<svg width="57" height="57" viewBox="0 0 57 57" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Figma Marker 93:4551 — transparent bg, ring + soft glow + gold dot -->
  <defs>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="28.5" cy="28.5" r="27.75" stroke="#E9B872" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="28.5" cy="28.5" r="5.5" fill="#E9B872" filter="url(#dotGlow)"/>
</svg>
